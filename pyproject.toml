
[tool.poetry]
name = "nbaml"
version = "0.1.0"
description = "NBA ML data collection utilities"
authors = ["apor0014 <apor0014@student.monash.edu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
pandas = "^2.0"
requests = "^2.28"
nba_api = "^1.1"
numpy = "^2.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^24.0"
isort = "^6.0"
pre-commit = "^3.0"

[[tool.poetry.packages]]
include = "data_collection"
from = "src"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
